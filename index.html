<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyöräilytulokset 2026</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --card-border: #1e293b;
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
            --text-color: #f8fafc;
            --text-light: #94a3b8;
            --table-hover: #1a263d;
            --badge-bg: #0369a1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0 0 40px 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        header p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-light);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--card-border);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 0.6rem;
            margin-top: 0;
            font-size: 1.25rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.7rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background-color: rgba(30, 41, 59, 0.4);
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: var(--table-hover);
        }

        .update-info {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: -1rem;
            margin-bottom: 1.5rem;
            font-family: monospace;
        }

        .no-data {
            color: var(--text-light);
            font-style: italic;
            text-align: center;
            padding: 1.5rem;
        }

        /* Urheilijan nimi - estetään rivittyminen */
        .rider-name {
            white-space: nowrap;
        }

        /* Nappi */
        .btn-container {
            text-align: center;
            margin-top: 1.5rem;
        }

        .load-more-btn {
            background-color: var(--badge-bg);
            color: #ffffff;
            border: 1px solid var(--primary-color);
            padding: 0.6rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .load-more-btn:hover {
            background-color: var(--primary-hover);
            color: white;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .hidden {
            display: none !important;
        }

        /* Sijoitusbadge ja mitalivärit */
        .sijoitus-badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: #bae6fd;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            min-width: 2rem;
        }

        .badge-1 {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        .badge-2 {
            background: linear-gradient(135deg, #cbd5e1, #94a3b8);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(148, 163, 184, 0.3);
        }

        .badge-3 {
            background: linear-gradient(135deg, #b45309, #92400e);
            color: #fef3c7;
            box-shadow: 0 2px 8px rgba(180, 83, 9, 0.3);
        }

        /* Mobiilin 2-rivinen CSS Grid -asettelu */
        @media screen and (max-width: 600px) {
            table thead {
                display: none;
            }
            table, tbody {
                display: block;
                width: 100%;
            }
            tr {
                display: grid;
                grid-template-columns: auto 1fr auto;
                grid-template-rows: auto auto;
                gap: 0.2rem 0.6rem;
                align-items: center;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding: 0.6rem 0.2rem;
            }
            tr:hover {
                background-color: transparent;
            }
            td {
                display: block;
                border: none;
                padding: 0;
            }

            /* Ruudukon paikat solutittain */
            td.col-sijoitus {
                grid-column: 1;
                grid-row: 1;
            }
            td.col-urheilija {
                grid-column: 2;
                grid-row: 1;
                font-weight: 600;
                color: var(--primary-color);
                font-size: 1rem;
            }
            td.col-pvm {
                grid-column: 3;
                grid-row: 1;
                font-size: 0.82rem;
                color: var(--text-light);
                text-align: right;
                white-space: nowrap;
            }
            td.col-kilpailu {
                grid-column: 1 / -1; /* Vie koko kakkosrivin leveydeltään */
                grid-row: 2;
                font-size: 0.88rem;
                color: var(--text-color);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Pyöräilytulokset 2026</h1>
        <p>Suomalaisten maantiepyöräilijöiden tuloksia maailmalla.</p>
    </header>

    <div class="container">
        <div class="update-info" id="update-info">Ladataan päivitysaikaa...</div>

        <div class="card">
            <h2>Viimeisimmät tulokset</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Sijoitus</th>
                            <th>Urheilija</th>
                            <th>Päivämäärä</th>
                            <th>Kilpailu</th>
                        </tr>
                    </thead>
                    <tbody id="tulokset-body">
                        <tr><td colspan="4" class="no-data">Ladataan tuloksia...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="btn-container hidden" id="nappi-container">
                <button class="load-more-btn" id="nayta-lisaa-btn" onclick="naytaLisaaTulokset()">Näytä lisää tuloksia</button>
            </div>
        </div>
    </div>

    <script>
        let kaikkiTulokset = [];
        let naytettaviaMaara = 10;

        function getSijoitusClass(sijoitus) {
            const s = String(sijoitus).trim().toLowerCase();
            if (s === '1' || s === '1st' || s === '1.') return 'sijoitus-badge badge-1';
            if (s === '2' || s === '2nd' || s === '2.') return 'sijoitus-badge badge-2';
            if (s === '3' || s === '3rd' || s === '3.') return 'sijoitus-badge badge-3';
            return 'sijoitus-badge';
        }

        async function lataaData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Datan lataus epäonnistui');
                
                const data = await response.json();

                if (data.paivitetty) {
                    const [ pvmOsa, aikaOsa ] = data.paivitetty.split(' ');
                    if (pvmOsa) {
                        const [ vuosi, kuukausi, paiva ] = pvmOsa.split('-');
                        const suomiPvm = `${paiva}.${kuukausi}.${vuosi}`;
                        document.getElementById('update-info').innerText = `Viimeksi päivitetty: ${suomiPvm} klo ${aikaOsa}`;
                    } else {
                        document.getElementById('update-info').innerText = `Viimeksi päivitetty: ${data.paivitetty}`;
                    }
                }

                if (data.tulokset && data.tulokset.length > 0) {
                    kaikkiTulokset = data.tulokset;
                    paivitaTaulukko();
                } else {
                    document.getElementById('tulokset-body').innerHTML = '<tr><td colspan="4" class="no-data">Ei tuoreita tuloksia tällä hetkellä.</td></tr>';
                }

            } catch (error) {
                console.error('Virhe haettaessa tietoja:', error);
                document.getElementById('update-info').innerText = 'Tietojen latauksessa tapahtui virhe.';
                document.getElementById('tulokset-body').innerHTML = '<tr><td colspan="4" class="no-data" style="color: #ef4444;">Virhe ladattaessa dataa.</td></tr>';
            }
        }

        function paivitaTaulukko() {
            const tuloksetBody = document.getElementById('tulokset-body');
            tuloksetBody.innerHTML = '';

            const naytettavat = kaikkiTulokset.slice(0, naytettaviaMaara);

            naytettavat.forEach(k => {
                const tr = document.createElement('tr');
                const kisaNimi = (k.etappi_tai_luokitus && k.etappi_tai_luokitus !== "Yksittäinen kilpailu")
                    ? `${k.kilpailu} (${k.etappi_tai_luokitus})`
                    : k.kilpailu;

                let pvmMuotoiltu = k.pvm ? String(k.pvm).trim() : '';
                if (pvmMuotoiltu && !pvmMuotoiltu.endsWith('.')) {
                    pvmMuotoiltu += '.';
                }

                tr.innerHTML = `
                    <td class="col-sijoitus"><span class="${getSijoitusClass(k.sijoitus)}">${k.sijoitus}</span></td>
                    <td class="col-urheilija"><span class="rider-name"><strong>${k.urheilija}</strong></span></td>
                    <td class="col-pvm">${pvmMuotoiltu}</td>
                    <td class="col-kilpailu">${kisaNimi}</td>
                `;
                tuloksetBody.appendChild(tr);
            });

            const nappiContainer = document.getElementById('nappi-container');
            if (naytettaviaMaara >= kaikkiTulokset.length) {
                nappiContainer.classList.add('hidden');
            } else {
                nappiContainer.classList.remove('hidden');
            }
        }

        function naytaLisaaTulokset() {
            naytettaviaMaara += 10;
            paivitaTaulukko();
        }

        lataaData();
    </script>
</body>
</html>
